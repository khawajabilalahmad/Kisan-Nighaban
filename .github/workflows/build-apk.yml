name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend Web Assets
        working-directory: frontend
        run: npm run build

      - name: Sync Web Assets to Android Project
        working-directory: frontend
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Android APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        working-directory: frontend/android/app/build/outputs/apk/debug
        run: mv app-debug.apk Kisaan-Nigahbaan.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kisaan-Nigahbaan-APK
          path: frontend/android/app/build/outputs/apk/debug/Kisaan-Nigahbaan.apk
          retention-days: 7
